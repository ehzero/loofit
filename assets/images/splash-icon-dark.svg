<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="lime-glass-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3FFA0"/>
      <stop offset="0.5" stop-color="#CFF56A"/>
      <stop offset="1" stop-color="#BEEA5A"/>
    </linearGradient>
    <linearGradient id="lime-glass-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2FFD0"/>
      <stop offset="0.45" stop-color="#D8F77E"/>
      <stop offset="1" stop-color="#AAD348"/>
    </linearGradient>
    <linearGradient id="lime-glass-highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="empty-glass-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2E2C" stop-opacity="0.78"/>
      <stop offset="0.55" stop-color="#171918" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#0C0D0C" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="empty-glass-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B615D"/>
      <stop offset="0.42" stop-color="#3A3E3B"/>
      <stop offset="1" stop-color="#242724"/>
    </linearGradient>
    <linearGradient id="empty-glass-highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#050506"/>
  <g aria-label="루핏 히트맵 심볼">
    <rect x="324" y="104" width="176" height="176" rx="36" fill="url(#lime-glass-fill)" stroke="url(#lime-glass-stroke)" stroke-width="8"/>
    <rect x="330" y="110" width="164" height="164" rx="30" fill="none" stroke="url(#lime-glass-highlight)" stroke-width="4"/>
    <rect x="525" y="105" width="174" height="174" rx="35" fill="url(#empty-glass-fill)" stroke="url(#empty-glass-stroke)" stroke-width="10"/>
    <rect x="532" y="112" width="160" height="160" rx="28" fill="none" stroke="url(#empty-glass-highlight)" stroke-width="4"/>
    <rect x="324" y="304" width="176" height="176" rx="36" fill="url(#lime-glass-fill)" stroke="url(#lime-glass-stroke)" stroke-width="8"/>
    <rect x="330" y="310" width="164" height="164" rx="30" fill="none" stroke="url(#lime-glass-highlight)" stroke-width="4"/>
    <rect x="524" y="304" width="176" height="176" rx="36" fill="url(#lime-glass-fill)" stroke="url(#lime-glass-stroke)" stroke-width="8"/>
    <rect x="530" y="310" width="164" height="164" rx="30" fill="none" stroke="url(#lime-glass-highlight)" stroke-width="4"/>
  </g>
  <text
    x="512"
    y="640"
    fill="#F4F4F2"
    font-family="Apple SD Gothic Neo, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="108"
    font-weight="700"
    letter-spacing="-3"
    text-anchor="middle"
  >루핏</text>
  <text
    x="512"
    y="740"
    fill="#8A8A90"
    font-family="Apple SD Gothic Neo, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="48"
    font-weight="500"
    letter-spacing="-1"
    text-anchor="middle"
  >내 루틴대로, 운동을 가볍게 기록하세요.</text>
</svg>
